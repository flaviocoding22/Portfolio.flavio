<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=Inter:wght@500&display=swap">
<style>
  *{box-sizing:border-box}
  body{margin:0;width:1200px;height:630px;background:#fff;font-family:Inter,sans-serif;position:relative;overflow:hidden}
  .txt{position:absolute;left:72px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;width:700px}
  .eyebrow{font-size:20px;letter-spacing:.2em;text-transform:uppercase;color:#B85F00;margin:0 0 22px}
  h1{font:800 70px/.98 Syne,sans-serif;text-transform:uppercase;margin:0;color:#111}
  h1 span{display:block}h1 .a{color:#FF8A00}
  .line{width:84px;height:6px;background:#FF8A00;margin:30px 0 22px}
  .sub{font-size:22px;letter-spacing:.14em;text-transform:uppercase;margin:0;color:#111;line-height:1.6}
  .ph{position:absolute;left:790px;top:60px;width:340px;height:460px}
  .ph::before{content:"";position:absolute;inset:0;transform:translate(20px,20px);background:#FF8A00}
  .ph img{position:relative;width:100%;height:100%;object-fit:cover;object-position:50% 30%;filter:grayscale(1) contrast(1.06);display:block}
</style></head><body>
<div class="txt"><p class="eyebrow">Portfólio de engenharia</p><h1><span>Flávio</span><span class="a">Monteiro</span></h1><div class="line"></div><p class="sub">Engenharia Mecânica · CAE<br>Simulação · Python</p></div>
<div class="ph"><img src="../../site/assets/img/flavio-hero.webp" alt=""></div>
</body></html>
