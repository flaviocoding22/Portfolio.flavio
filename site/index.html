<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flávio Monteiro — Engenharia Mecânica, CAE e Vibrações</title>
<meta name="description" content="Portfolio de engenharia: CAE, simulação e vibrações.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8' fill='%23FF8A00'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syne:wght@500;800&family=Inter:wght@400;500&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#principal">Pular para o conteúdo</a>
<header class="site-header">
  <nav aria-label="Principal">
    <ul>
      <li><a href="#sobre">Sobre</a></li>
      <li><a href="#curriculo">Currículo</a></li>
      <li><a href="#projetos">Projetos</a></li>
      <li><a href="#contato">Contato</a></li>
    </ul>
  </nav>
</header>
<main id="principal">
  <section class="hero hero--a" aria-labelledby="titulo">
    <div class="hero-text">
      <p id="eyebrow" class="hero-eyebrow">Portfólio de engenharia</p>
      <h1 id="titulo" class="display"><span id="nome-primeiro">Flávio</span> <span id="nome-resto" class="accent">Monteiro</span></h1>
      <div class="hero-line" aria-hidden="true"></div>
      <p id="tagline" class="hero-sub">Engenharia Mecânica · CAE · Simulação · Vibrações</p>
    </div>
    <figure class="hero-photo">
      <svg id="hero-svg" viewBox="0 0 800 1000" role="img" aria-label="Espaço reservado cinza para a foto principal" preserveAspectRatio="xMidYMid slice">
        <rect width="800" height="1000" fill="#cfcfcf"/>
        <path d="M0 1000L800 0M0 0L800 1000" stroke="#b5b5b5" stroke-width="2" fill="none"/>
      </svg>
      <figcaption id="hero-legenda"></figcaption>
    </figure>
  </section>

  <section id="sobre" class="block" aria-labelledby="h-sobre">
    <h2 id="h-sobre" class="label">Sobre</h2>
    <div id="sobre-texto" class="content">
      <p class="muted">Carregando…</p>
    </div>
  </section>

  <section id="curriculo" class="block" aria-labelledby="h-cv">
    <h2 id="h-cv" class="label">Currículo</h2>
    <div class="content">
      <ul id="cv-lista" class="cv"></ul>
      <p><a id="cv-pdf" class="btn" href="#contato" aria-disabled="true">Currículo</a></p>
    </div>
  </section>

  <section id="projetos" class="block" aria-labelledby="h-proj">
    <h2 id="h-proj" class="label">Projetos</h2>
    <div class="content wide">
      <div id="grade" class="grid" aria-live="polite"><p class="muted">Carregando projetos…</p></div>
    </div>
  </section>

  <section id="contato" class="block" aria-labelledby="h-contato">
    <h2 id="h-contato" class="label">Contato</h2>
    <div id="contato-lista" class="content"></div>
  </section>
</main>
<footer class="site-footer"><p>© <span id="ano">2026</span> <span id="nome-rodape">Flávio</span></p></footer>
<script src="js/home.js"></script>
</body>
</html>
